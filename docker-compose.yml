x-n8n: &n8n
  image: n8nio/n8n:2.45.7
  env_file:
    - path: n8n/.env
      required: true
  volumes:
    - n8n_data:/home/node/.n8n
    - ./n8n:/seed:ro

services:
  # Loads the workflows and the Mailpit SMTP credential on every start,
  # so the JSON in n8n/workflows stays the source of truth.
  n8n-import:
    <<: *n8n
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        n8n import:credentials --input=/seed/credentials/mailpit-smtp.json &&
        n8n import:workflow --separate --input=/seed/workflows &&
        n8n publish:workflow --id=lendloopLoanEvt1 &&
        n8n publish:workflow --id=lendloopOverdue1 &&
        n8n publish:workflow --id=lendloopErrors01

  n8n:
    <<: *n8n
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "5678:5678"
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  n8n_data:
